worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req_zone $server_name zone=atlas_requests:1m rate=20r/s;
    limit_conn_zone $server_name zone=atlas_connections:1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8786;
        server_name _;
        limit_req zone=atlas_requests burst=60 nodelay;
        limit_req_status 429;
        limit_conn atlas_connections 16;
        limit_conn_status 429;
        location / {
            set $atlas_backend atlas:8786;
            proxy_pass http://$atlas_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_max_temp_file_size 0;
        }
    }
}

name: layer-atlas
services:
  atlas:
    build: .
    image: layer-atlas:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    volumes:
      - results:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks: [isolated]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8786/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
  gateway:
    build:
      context: gateway
    image: layer-atlas-gateway:local
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=96m,mode=1777
    ports:
      - "127.0.0.1:${LAYER_ATLAS_PORT:-8786}:8786"
    networks: [ingress, isolated]
    depends_on:
      atlas:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8786/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
networks:
  ingress:
  isolated:
    internal: true
volumes:
  results:
